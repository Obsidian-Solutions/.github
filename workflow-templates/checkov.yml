# Infrastructure-as-code scan (Checkov)
# Runs on pushes and pull requests that change Terraform or Bicep files.
# Fails the run on security misconfigurations.

name: IaC scan

on:
  push:
    branches: [main]
    paths: ["**/*.tf", "**/*.bicep"]
  pull_request:
    branches: [main]
    paths: ["**/*.tf", "**/*.bicep"]

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@33bef1e73cddbbe71130328ff1a333c1c24f43d3 # v12.3021.0
        with:
          framework: terraform,bicep,cloudformation,kubernetes
          quiet: true
          soft_fail: false
