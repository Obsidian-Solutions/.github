# Container image vulnerability scan (Trivy)
# Runs on pushes and pull requests that change a Dockerfile at the repo root.
# Fails the run when CRITICAL or HIGH vulnerabilities are found in the image.
# No GitHub Advanced Security needed: the scan fails on findings directly.

name: Container scan

on:
  push:
    branches: [main]
    paths: ["Dockerfile"]
  pull_request:
    branches: [main]
    paths: ["Dockerfile"]
  schedule:
    - cron: "21 3 * * 1"

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t app:ci .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: app:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
