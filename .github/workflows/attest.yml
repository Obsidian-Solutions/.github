# Reusable attestation. Called from each repository's own attest.yml
# when a release is published. Signs every release asset with the
# workflow's OIDC identity, so a downloader can verify provenance
# (JSP 945 release process). workflow_call means it never triggers
# itself; the caller declares the release event.

name: Attest release assets

on:
  workflow_call:

permissions:
  id-token: write
  contents: read
  # The attest-build-provenance action POSTs the attestation to
  # /repos/attestations. This permission must live here: a reusable
  # workflow's own permissions block REPLACES the caller's, so the
  # caller's attestations: write never flows through (the caller-side
  # fix alone still fails with 'Resource not accessible by
  # integration').
  attestations: write

jobs:
  attest:
    name: Attest release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG"
          ls -1

      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
