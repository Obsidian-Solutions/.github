# Actionlint: validates every workflow file in the repo.
# A workflow with a YAML or schema error fails at startup with a useless
# message (we hit this today). This gate catches it at merge time.
# Call from a caller with:
#   on:
#     pull_request:
#     push:
#       branches: [main]

name: actionlint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint on all workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
